# Keeps the free Supabase project from pausing.
# Free projects pause after about a week with no activity. Every three days
# this calls the tiny ping() database function, which touches no data.
#
# It needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       the project URL, for example https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (never the secret key)
name: Keep Supabase awake

on:
  schedule:
    # 9:17 AM in Manila on days 1, 4, 7, ... of each month
    - cron: '17 1 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first."
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body --max-time 30 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase answered: $response"
          echo "$response" | grep -q pong
